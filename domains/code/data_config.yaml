dataset_name: glaiveai/glaive-code-assistant-v3
dataset_split: train
text_fields:
  - question
  - answer

# Full dataset is 950,384 rows — capped here so a full data-prep + LoRA train +
# eval cycle fits a free-tier Colab T4 session. Raise this (or drop the key
# entirely) if you're running on Colab Pro / a bigger GPU budget.
max_examples: 20000
